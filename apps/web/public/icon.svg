<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0C1324"/>
      <stop offset="100%" stop-color="#1E3A8A"/>
    </linearGradient>
    <linearGradient id="hemi" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0C1E5C"/>
      <stop offset="100%" stop-color="#1E3A8A"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Full-bleed background with rounded corners (maskable-safe) -->
  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- Ambient radial glow -->
  <circle cx="256" cy="256" r="220" fill="#1E3A8A" opacity="0.25"/>

  <!-- BrainMark centered and scaled (source viewBox -260..260 = 520 units; fit to 380px for safe zone) -->
  <g transform="translate(256 256) scale(0.73)">
    <path d="M -200 -40 C -210 -90, -180 -150, -130 -180 C -70 -210, 10 -218, 80 -200 C 145 -184, 195 -148, 215 -90 C 230 -40, 232 10, 215 60 C 205 95, 180 115, 145 120 C 175 130, 195 155, 195 175 L 100 175 C 90 165, 70 158, 45 158 C 25 158, 5 168, -5 175 L -60 175 C -75 168, -90 152, -100 130 C -115 95, -135 80, -160 70 C -190 55, -210 25, -212 -5 Z"
          fill="url(#hemi)" stroke="rgba(94,234,254,0.65)" stroke-width="8"/>
    <path d="M -160 50 C -100 35, -20 30, 60 40 C 110 48, 150 60, 180 70"
          stroke="rgba(94,234,254,0.65)" stroke-width="5" fill="none" opacity="0.8"/>
    <path d="M 0 -180 C -10 -130, -10 -70, 0 -10"
          stroke="rgba(94,234,254,0.65)" stroke-width="5" fill="none" opacity="0.8"/>

    <!-- Synapse nodes with glow -->
    <circle cx="-90" cy="-50" r="14" fill="#5EEAFE" filter="url(#glow)"/>
    <circle cx="60" cy="-60" r="14" fill="#5EEAFE" filter="url(#glow)"/>
    <circle cx="130" cy="-30" r="12" fill="#5EEAFE" filter="url(#glow)"/>
  </g>
</svg>
