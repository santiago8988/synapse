<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Synapse by NosisHub — Gestión de calidad</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    /* Brand primitives (de NosisHub landing) */
    --brand-prusia: #1E3A8A;
    --brand-cian: #5EEAFE;
    --brand-cielo: #7AB8FF;

    /* Light theme (default) */
    --bg-0: #F6F7FB;           /* canvas ambiental */
    --bg-1: #FFFFFF;           /* superficie principal */
    --bg-2: #FBFCFE;           /* superficie elevada */
    --bg-3: #F1F3F9;           /* hover / sunken */
    --bg-sidebar: #0C1324;     /* sidebar dark siempre — firma de marca */
    --bg-sidebar-2: #121B30;
    --ink-0: #0B1020;          /* texto primario */
    --ink-1: #2D3858;          /* texto secundario */
    --ink-2: #5C6785;          /* texto terciario */
    --ink-3: #8892AC;          /* muted */
    --ink-4: #B6BECE;          /* placeholder */
    --line: #E3E7F1;
    --line-2: #D0D7E6;
    --line-strong: #AAB3C7;
    --primary: #1E3A8A;        /* azul prusiano */
    --primary-ink: #0F1F55;
    --primary-soft: #E8EEFC;
    --accent: #0891B2;         /* cian-teal legible en claro; cian eléctrico solo en live */
    --accent-live: #06B6D4;
    --accent-glow: rgba(94,234,254,0.35);
    --ok: #047857;
    --ok-soft: #DCFCE7;
    --warn: #B45309;
    --warn-soft: #FEF3C7;
    --danger: #B91C1C;
    --danger-soft: #FEE2E2;
    --info: #1D4ED8;
    --info-soft: #DBEAFE;

    --shadow-xs: 0 1px 0 rgba(12,19,36,0.04);
    --shadow-sm: 0 1px 2px rgba(12,19,36,0.06), 0 1px 1px rgba(12,19,36,0.04);
    --shadow-md: 0 8px 24px -8px rgba(12,19,36,0.12), 0 2px 4px rgba(12,19,36,0.05);
    --shadow-lg: 0 24px 60px -20px rgba(12,19,36,0.18), 0 6px 12px rgba(12,19,36,0.06);

    --radius-sm: 6px;
    --radius: 10px;
    --radius-lg: 14px;
    --radius-xl: 20px;

    --mono: "JetBrains Mono", ui-monospace, SF Mono, Menlo, monospace;
    --sans: "Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    --serif: "Instrument Serif", "Times New Roman", serif;

    /* Density */
    --dens-row: 44px;
    --dens-pad-y: 10px;
    --dens-pad-x: 14px;
    --dens-font: 14px;
    --dens-gap: 16px;

    --sidebar-w: 256px;
  }

  [data-theme="dark"] {
    --bg-0: #04070F;
    --bg-1: #080D1A;
    --bg-2: #0C1324;
    --bg-3: #121B30;
    --ink-0: #F3F6FC;
    --ink-1: #C7D0E3;
    --ink-2: #8892AC;
    --ink-3: #5B6683;
    --ink-4: #3E4762;
    --line: rgba(255,255,255,0.08);
    --line-2: rgba(255,255,255,0.14);
    --line-strong: rgba(255,255,255,0.24);
    --primary: #7AB8FF;
    --primary-ink: #C7D0E3;
    --primary-soft: rgba(30,58,138,0.25);
    --accent: #5EEAFE;
    --accent-live: #5EEAFE;
    --ok: #6EE7B7;
    --ok-soft: rgba(110,231,183,0.12);
    --warn: #FFB86B;
    --warn-soft: rgba(255,184,107,0.12);
    --danger: #F87171;
    --danger-soft: rgba(248,113,113,0.12);
    --info: #7AB8FF;
    --info-soft: rgba(122,184,255,0.12);
    --shadow-sm: 0 1px 2px rgba(0,0,0,0.4);
    --shadow-md: 0 12px 30px -10px rgba(0,0,0,0.6);
    --shadow-lg: 0 30px 80px -20px rgba(0,0,0,0.7);
  }

  [data-density="dense"] {
    --dens-row: 36px;
    --dens-pad-y: 6px;
    --dens-pad-x: 10px;
    --dens-font: 13px;
    --dens-gap: 10px;
  }
  [data-density="cozy"] {
    --dens-row: 52px;
    --dens-pad-y: 14px;
    --dens-pad-x: 18px;
    --dens-font: 15px;
    --dens-gap: 20px;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    font-family: var(--sans);
    background: var(--bg-0);
    color: var(--ink-0);
    font-feature-settings: "ss01","ss02","cv11";
    -webkit-font-smoothing: antialiased;
    letter-spacing: -0.003em;
    line-height: 1.5;
    overflow: hidden;
  }
  #root { height: 100vh; display: flex; flex-direction: column; }

  button { font-family: inherit; cursor: pointer; background: none; border: 0; color: inherit; padding: 0; }
  input, textarea, select { font-family: inherit; color: inherit; }

  /* === APP SHELL === */
  .shell {
    display: grid;
    grid-template-columns: var(--sidebar-w) 1fr;
    height: 100vh;
    background: var(--bg-0);
  }

  /* --- SIDEBAR --- */
  .sidebar {
    background: var(--bg-sidebar);
    color: #E2E8F5;
    display: flex;
    flex-direction: column;
    border-right: 1px solid rgba(255,255,255,0.05);
    position: relative;
    overflow: hidden;
  }
  .sidebar::before {
    content: "";
    position: absolute;
    inset: 0;
    background:
      radial-gradient(600px 400px at -20% 0%, rgba(30,58,138,0.5), transparent 60%),
      radial-gradient(300px 200px at 100% 100%, rgba(94,234,254,0.07), transparent 60%);
    pointer-events: none;
  }
  .sb-brand {
    padding: 20px 20px 22px;
    display: flex;
    align-items: center;
    gap: 12px;
    border-bottom: 1px solid rgba(255,255,255,0.06);
    position: relative;
  }
  .sb-mark { width: 36px; height: 36px; flex-shrink: 0; }
  .sb-wordmark {
    display: flex; flex-direction: column; line-height: 1;
  }
  .sb-wordmark .s-name {
    font-family: var(--serif);
    font-size: 22px;
    letter-spacing: -0.01em;
    color: #F3F6FC;
  }
  .sb-wordmark .s-name em { font-style: italic; color: var(--brand-cian); }
  .sb-wordmark .s-parent {
    font-family: var(--mono);
    font-size: 9px;
    letter-spacing: 0.22em;
    color: #6A7797;
    margin-top: 4px;
    text-transform: uppercase;
  }

  .sb-org {
    padding: 14px 16px;
    margin: 12px;
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 10px;
    background: rgba(255,255,255,0.02);
    display: flex;
    align-items: center;
    gap: 10px;
    cursor: pointer;
    transition: background .2s ease, border-color .2s ease;
    position: relative;
  }
  .sb-org:hover { background: rgba(255,255,255,0.04); border-color: rgba(255,255,255,0.14); }
  .sb-org-av {
    width: 30px; height: 30px;
    border-radius: 8px;
    background: linear-gradient(135deg, var(--brand-prusia), #0C1E5C);
    display: flex; align-items: center; justify-content: center;
    font-family: var(--serif);
    font-size: 15px;
    color: var(--brand-cian);
    flex-shrink: 0;
    border: 1px solid rgba(94,234,254,0.25);
  }
  .sb-org-info { flex: 1; min-width: 0; }
  .sb-org-name { font-size: 13px; color: #F3F6FC; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sb-org-sub { font-family: var(--mono); font-size: 9px; letter-spacing: 0.14em; color: #6A7797; text-transform: uppercase; margin-top: 3px; }
  .sb-org svg.chev { color: #6A7797; flex-shrink: 0; }

  .sb-nav { flex: 1; overflow-y: auto; padding: 8px 0 14px; position: relative; }
  .sb-nav::-webkit-scrollbar { width: 6px; }
  .sb-nav::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius: 3px; }

  .sb-group-label {
    font-family: var(--mono);
    font-size: 9.5px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: #4E5977;
    padding: 18px 24px 8px;
  }
  .sb-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 9px 16px 9px 24px;
    margin: 1px 10px;
    border-radius: 8px;
    color: #A9B4CC;
    font-size: 13.5px;
    cursor: pointer;
    transition: background .15s ease, color .15s ease;
    position: relative;
  }
  .sb-item:hover { background: rgba(255,255,255,0.04); color: #F3F6FC; }
  .sb-item.active {
    background: rgba(94,234,254,0.09);
    color: #F3F6FC;
  }
  .sb-item.active::before {
    content: "";
    position: absolute;
    left: 0;
    top: 8px; bottom: 8px;
    width: 2px;
    background: var(--brand-cian);
    box-shadow: 0 0 10px var(--brand-cian);
    border-radius: 2px;
  }
  .sb-item svg { width: 17px; height: 17px; flex-shrink: 0; opacity: 0.75; }
  .sb-item.active svg { opacity: 1; color: var(--brand-cian); }
  .sb-badge {
    margin-left: auto;
    font-family: var(--mono);
    font-size: 10px;
    background: rgba(94,234,254,0.15);
    color: var(--brand-cian);
    padding: 2px 7px;
    border-radius: 999px;
    border: 1px solid rgba(94,234,254,0.25);
  }
  .sb-badge.warn { background: rgba(255,184,107,0.12); color: #FFB86B; border-color: rgba(255,184,107,0.28); }

  .sb-user {
    border-top: 1px solid rgba(255,255,255,0.06);
    padding: 14px 16px;
    display: flex;
    align-items: center;
    gap: 10px;
    position: relative;
  }
  .sb-user-av {
    width: 32px; height: 32px;
    border-radius: 50%;
    background: linear-gradient(135deg, #7AB8FF, #1E3A8A);
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 500;
    color: #F3F6FC;
    flex-shrink: 0;
  }
  .sb-user-info { flex: 1; min-width: 0; }
  .sb-user-name { font-size: 13px; color: #F3F6FC; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sb-user-role { font-family: var(--mono); font-size: 9px; letter-spacing: 0.14em; color: #6A7797; text-transform: uppercase; margin-top: 2px; }

  /* --- MAIN --- */
  .main-col {
    display: flex;
    flex-direction: column;
    overflow: hidden;
    min-width: 0;
  }
  .topbar {
    height: 60px;
    border-bottom: 1px solid var(--line);
    background: var(--bg-1);
    display: flex;
    align-items: center;
    padding: 0 28px;
    gap: 20px;
    flex-shrink: 0;
  }
  .crumbs {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    color: var(--ink-2);
    flex: 1;
    min-width: 0;
  }
  .crumbs .sep { color: var(--ink-4); font-size: 10px; }
  .crumbs .current { color: var(--ink-0); font-weight: 500; }
  .crumbs .home { display: flex; align-items: center; gap: 6px; cursor: pointer; }
  .crumbs .home:hover { color: var(--ink-0); }

  .area-pill {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 7px 12px 7px 14px;
    border: 1px solid var(--line-2);
    border-radius: 999px;
    font-size: 12.5px;
    color: var(--ink-1);
    background: var(--bg-2);
    cursor: pointer;
    transition: all .18s ease;
  }
  .area-pill:hover { border-color: var(--line-strong); background: var(--bg-3); }
  .area-pill .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 6px var(--accent); }

  .top-actions { display: flex; align-items: center; gap: 12px; }
  .icon-btn {
    width: 38px; height: 38px;
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    border: 1px solid transparent;
    color: var(--ink-2);
    position: relative;
    transition: all .18s ease;
  }
  .icon-btn:hover { background: var(--bg-3); color: var(--ink-0); }
  .icon-btn .notif-dot {
    position: absolute;
    top: 8px; right: 10px;
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--danger);
    border: 2px solid var(--bg-1);
  }

  .content {
    flex: 1;
    overflow-y: auto;
    padding: 28px 32px 80px;
    position: relative;
  }
  .content.edge-to-edge { padding: 0; }

  /* === PAGE HEADING === */
  .ph {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 24px;
    margin-bottom: 28px;
    flex-wrap: wrap;
  }
  .ph h1 {
    font-family: var(--serif);
    font-weight: 400;
    font-size: 44px;
    line-height: 1.05;
    letter-spacing: -0.02em;
    margin: 0;
    color: var(--ink-0);
  }
  .ph h1 .italic { font-style: italic; color: var(--primary); }
  [data-theme="dark"] .ph h1 .italic { color: var(--brand-cian); }
  .ph .sub { color: var(--ink-2); font-size: 14px; margin-top: 8px; max-width: 560px; }
  .ph-actions { display: flex; gap: 10px; align-items: center; }

  /* === BUTTONS === */
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 9px 14px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 500;
    border: 1px solid transparent;
    transition: all .18s cubic-bezier(.2,.6,.2,1);
    white-space: nowrap;
    cursor: pointer;
    letter-spacing: -0.005em;
  }
  .btn-primary {
    background: var(--primary);
    color: #FFF;
    box-shadow: 0 1px 2px rgba(30,58,138,0.3), inset 0 1px 0 rgba(255,255,255,0.1);
  }
  .btn-primary:hover { background: var(--primary-ink); transform: translateY(-1px); box-shadow: 0 4px 12px -2px rgba(30,58,138,0.35); }
  [data-theme="dark"] .btn-primary { background: var(--brand-cian); color: #051026; box-shadow: 0 0 0 1px rgba(94,234,254,0.4), 0 8px 24px -8px var(--accent-glow); }
  [data-theme="dark"] .btn-primary:hover { background: #7FF0FF; }

  .btn-ghost {
    color: var(--ink-1);
    background: var(--bg-1);
    border-color: var(--line-2);
  }
  .btn-ghost:hover { border-color: var(--line-strong); background: var(--bg-2); color: var(--ink-0); }

  .btn-subtle {
    color: var(--ink-1);
    background: transparent;
  }
  .btn-subtle:hover { background: var(--bg-3); color: var(--ink-0); }

  .btn-danger {
    color: var(--danger);
    background: var(--danger-soft);
    border-color: transparent;
  }
  .btn-danger:hover { background: var(--danger); color: #fff; }

  /* === CARD === */
  .card {
    background: var(--bg-1);
    border: 1px solid var(--line);
    border-radius: var(--radius-lg);
    overflow: hidden;
    box-shadow: var(--shadow-xs);
  }
  .card-head {
    padding: 18px 20px;
    border-bottom: 1px solid var(--line);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
  }
  .card-head h3 {
    margin: 0;
    font-family: var(--serif);
    font-weight: 400;
    font-size: 22px;
    letter-spacing: -0.01em;
    color: var(--ink-0);
  }
  .card-head .eyebrow {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--ink-3);
  }
  .card-body { padding: 20px; }

  /* === FORM CONTROLS === */
  .field {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .field-label {
    font-size: 12px;
    font-weight: 500;
    color: var(--ink-1);
    letter-spacing: -0.002em;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .field-label .req { color: var(--danger); margin-left: 2px; }
  .field-label .hint { font-family: var(--mono); font-size: 10px; letter-spacing: 0.1em; color: var(--ink-3); text-transform: uppercase; font-weight: 400; }

  .input, .select, .textarea {
    background: var(--bg-1);
    border: 1px solid var(--line-2);
    border-radius: 8px;
    padding: var(--dens-pad-y) var(--dens-pad-x);
    font-size: var(--dens-font);
    color: var(--ink-0);
    transition: border-color .15s ease, box-shadow .15s ease, background .15s ease;
    width: 100%;
    outline: none;
    min-height: var(--dens-row);
  }
  .input:hover, .select:hover, .textarea:hover { border-color: var(--line-strong); }
  .input:focus, .select:focus, .textarea:focus {
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(30,58,138,0.1);
    background: var(--bg-1);
  }
  [data-theme="dark"] .input:focus, [data-theme="dark"] .select:focus, [data-theme="dark"] .textarea:focus {
    border-color: var(--brand-cian);
    box-shadow: 0 0 0 3px rgba(94,234,254,0.15);
  }
  .input.calc {
    background: var(--bg-3);
    color: var(--ink-1);
    font-family: var(--mono);
    font-size: 13px;
  }
  .input.error { border-color: var(--danger); box-shadow: 0 0 0 3px rgba(185,28,28,0.08); }
  .textarea { min-height: 80px; resize: vertical; padding: 12px 14px; }
  .select {
    appearance: none;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8' viewBox='0 0 12 8'><path d='M1 1l5 5 5-5' stroke='%235C6785' stroke-width='1.5' fill='none' stroke-linecap='round'/></svg>");
    background-repeat: no-repeat;
    background-position: right 12px center;
    padding-right: 34px;
  }

  .unit-input {
    display: flex;
    align-items: stretch;
    border: 1px solid var(--line-2);
    border-radius: 8px;
    overflow: hidden;
    background: var(--bg-1);
    transition: border-color .15s ease, box-shadow .15s ease;
  }
  .unit-input:hover { border-color: var(--line-strong); }
  .unit-input:focus-within { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(30,58,138,0.1); }
  [data-theme="dark"] .unit-input:focus-within { border-color: var(--brand-cian); box-shadow: 0 0 0 3px rgba(94,234,254,0.15); }
  .unit-input input {
    border: 0;
    outline: none;
    flex: 1;
    min-width: 0;
    background: transparent;
    padding: var(--dens-pad-y) var(--dens-pad-x);
    font-size: var(--dens-font);
    color: var(--ink-0);
  }
  .unit-input .unit {
    padding: 0 12px;
    display: flex; align-items: center;
    font-family: var(--mono);
    font-size: 11.5px;
    color: var(--ink-2);
    background: var(--bg-3);
    border-left: 1px solid var(--line);
    letter-spacing: 0.02em;
  }

  /* Radio / checkbox */
  .radio-group { display: flex; flex-wrap: wrap; gap: 6px; }
  .radio-opt {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 8px 12px;
    border: 1px solid var(--line-2);
    border-radius: 8px;
    font-size: 13px;
    color: var(--ink-1);
    cursor: pointer;
    background: var(--bg-1);
    transition: all .15s ease;
    user-select: none;
  }
  .radio-opt:hover { border-color: var(--line-strong); }
  .radio-opt.on {
    border-color: var(--primary);
    background: var(--primary-soft);
    color: var(--primary);
  }
  [data-theme="dark"] .radio-opt.on { border-color: var(--brand-cian); background: rgba(94,234,254,0.08); color: var(--brand-cian); }
  .radio-opt .dot {
    width: 14px; height: 14px;
    border: 1.5px solid var(--line-strong);
    border-radius: 50%;
    position: relative;
  }
  .radio-opt.on .dot { border-color: currentColor; }
  .radio-opt.on .dot::after {
    content: "";
    position: absolute;
    inset: 2.5px;
    background: currentColor;
    border-radius: 50%;
  }

  .checkbox {
    display: inline-flex; align-items: center; gap: 8px;
    font-size: 13px;
    color: var(--ink-1);
    cursor: pointer;
    user-select: none;
  }
  .checkbox .box {
    width: 16px; height: 16px;
    border: 1.5px solid var(--line-strong);
    border-radius: 4px;
    display: flex; align-items: center; justify-content: center;
    transition: all .15s ease;
  }
  .checkbox.on .box { background: var(--primary); border-color: var(--primary); color: #fff; }
  [data-theme="dark"] .checkbox.on .box { background: var(--brand-cian); border-color: var(--brand-cian); color: #051026; }
  .checkbox .box svg { width: 10px; height: 10px; stroke-width: 3; opacity: 0; }
  .checkbox.on .box svg { opacity: 1; }

  /* Toggle */
  .toggle {
    width: 34px; height: 20px;
    border-radius: 999px;
    background: var(--line-strong);
    position: relative;
    transition: background .2s ease;
    cursor: pointer;
    flex-shrink: 0;
  }
  .toggle::after {
    content: "";
    position: absolute;
    width: 14px; height: 14px;
    background: #fff;
    border-radius: 50%;
    top: 3px; left: 3px;
    transition: left .2s ease;
    box-shadow: 0 1px 2px rgba(0,0,0,0.2);
  }
  .toggle.on { background: var(--primary); }
  [data-theme="dark"] .toggle.on { background: var(--brand-cian); }
  .toggle.on::after { left: 17px; }

  /* === STATUS CHIP === */
  .chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 3px 9px;
    font-family: var(--mono);
    font-size: 10.5px;
    letter-spacing: 0.1em;
    font-weight: 500;
    text-transform: uppercase;
    border-radius: 999px;
    border: 1px solid transparent;
  }
  .chip-draft { background: var(--bg-3); color: var(--ink-2); border-color: var(--line-2); }
  .chip-active, .chip-approved { background: var(--info-soft); color: var(--info); }
  .chip-completed, .chip-ok { background: var(--ok-soft); color: var(--ok); }
  .chip-review, .chip-warn { background: var(--warn-soft); color: var(--warn); }
  .chip-fail, .chip-danger, .chip-inactive { background: var(--danger-soft); color: var(--danger); }
  .chip .pulse {
    width: 5px; height: 5px;
    border-radius: 50%;
    background: currentColor;
    box-shadow: 0 0 6px currentColor;
    animation: pulseDot 1.8s infinite;
  }
  @keyframes pulseDot { 50% { opacity: 0.4; } }

  /* === KPI === */
  .kpi-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 16px;
    margin-bottom: 24px;
  }
  .kpi {
    background: var(--bg-1);
    border: 1px solid var(--line);
    border-radius: var(--radius-lg);
    padding: 20px 22px;
    position: relative;
    overflow: hidden;
    transition: border-color .2s ease;
  }
  .kpi:hover { border-color: var(--line-strong); }
  .kpi .klabel {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--ink-3);
  }
  .kpi .kval {
    font-family: var(--serif);
    font-size: 48px;
    font-weight: 400;
    color: var(--ink-0);
    line-height: 1;
    margin-top: 10px;
    letter-spacing: -0.02em;
  }
  .kpi .kval .italic { font-style: italic; color: var(--primary); }
  [data-theme="dark"] .kpi .kval .italic { color: var(--brand-cian); }
  .kpi .kfoot {
    margin-top: 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    font-size: 12px;
    color: var(--ink-2);
  }
  .kpi .delta-up { color: var(--ok); font-family: var(--mono); font-size: 11px; display: inline-flex; align-items: center; gap: 3px; }
  .kpi .delta-dn { color: var(--danger); font-family: var(--mono); font-size: 11px; display: inline-flex; align-items: center; gap: 3px; }
  .kpi-spark {
    height: 28px;
    margin-top: 8px;
  }
  .kpi::before {
    content: "";
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--line), transparent);
  }
  .kpi.accent::before { background: linear-gradient(90deg, transparent, var(--accent-live), transparent); }

  /* === TWO-COL DASHBOARD === */
  .dash-grid {
    display: grid;
    grid-template-columns: 1.6fr 1fr;
    gap: 20px;
    align-items: start;
  }

  .task-list { display: flex; flex-direction: column; }
  .task-group-label {
    padding: 16px 20px 10px;
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--ink-3);
    border-top: 1px solid var(--line);
  }
  .task-group-label:first-child { border-top: 0; padding-top: 8px; }
  .task-item {
    display: grid;
    grid-template-columns: auto 1fr auto auto;
    gap: 14px;
    align-items: center;
    padding: 12px 20px;
    cursor: pointer;
    border-left: 2px solid transparent;
    transition: background .15s ease, border-color .15s ease;
  }
  .task-item:hover { background: var(--bg-3); border-left-color: var(--primary); }
  [data-theme="dark"] .task-item:hover { border-left-color: var(--brand-cian); }
  .task-check {
    width: 18px; height: 18px;
    border: 1.5px solid var(--line-strong);
    border-radius: 50%;
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    color: var(--ok);
    transition: all .15s ease;
  }
  .task-item.done .task-check { background: var(--ok); border-color: var(--ok); color: #fff; }
  .task-item.fail .task-check { background: var(--danger); border-color: var(--danger); color: #fff; }
  .task-check svg { width: 10px; height: 10px; stroke-width: 3; opacity: 0; }
  .task-item.done .task-check svg, .task-item.fail .task-check svg { opacity: 1; }
  .task-name { font-size: 14px; color: var(--ink-0); }
  .task-item.done .task-name { color: var(--ink-2); }
  .task-meta { font-family: var(--mono); font-size: 11px; color: var(--ink-3); letter-spacing: 0.04em; }

  /* Activity feed */
  .feed-item {
    display: grid;
    grid-template-columns: auto 1fr;
    gap: 14px;
    padding: 14px 20px;
    border-top: 1px solid var(--line);
  }
  .feed-item:first-child { border-top: 0; }
  .feed-av {
    width: 28px; height: 28px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--primary), #0C1E5C);
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; color: #fff; font-weight: 500;
    flex-shrink: 0;
  }
  .feed-text { font-size: 13px; color: var(--ink-1); line-height: 1.5; }
  .feed-text b { color: var(--ink-0); font-weight: 600; }
  .feed-time { font-family: var(--mono); font-size: 10px; color: var(--ink-3); letter-spacing: 0.05em; margin-top: 4px; }

  /* === RECORD BUILDER === */
  .builder {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
    height: calc(100vh - 60px - 76px);
  }
  .builder-col {
    overflow-y: auto;
    padding: 24px 32px;
  }
  .builder-col.right {
    background:
      radial-gradient(600px 400px at 50% 0%, var(--bg-3), transparent 60%),
      var(--bg-0);
    border-left: 1px solid var(--line);
  }
  .builder-section {
    margin-bottom: 28px;
  }
  .bs-head {
    display: flex; align-items: center; gap: 10px;
    margin-bottom: 14px;
  }
  .bs-num {
    width: 22px; height: 22px;
    border-radius: 50%;
    background: var(--primary-soft);
    color: var(--primary);
    display: flex; align-items: center; justify-content: center;
    font-family: var(--mono);
    font-size: 11px;
    font-weight: 600;
  }
  [data-theme="dark"] .bs-num { background: rgba(94,234,254,0.12); color: var(--brand-cian); }
  .bs-title {
    font-family: var(--serif);
    font-size: 20px;
    font-weight: 400;
    color: var(--ink-0);
    letter-spacing: -0.01em;
  }
  .bs-sub { font-size: 12px; color: var(--ink-2); margin-left: auto; }

  .fields-list { display: flex; flex-direction: column; gap: 8px; }
  .field-card {
    background: var(--bg-1);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 12px 14px;
    transition: all .15s ease;
  }
  .field-card:hover { border-color: var(--line-strong); }
  .field-card.selected { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(30,58,138,0.08); }
  [data-theme="dark"] .field-card.selected { border-color: var(--brand-cian); box-shadow: 0 0 0 3px rgba(94,234,254,0.1); }
  .field-card-head {
    display: grid;
    grid-template-columns: auto 1fr auto auto;
    gap: 12px;
    align-items: center;
  }
  .fc-drag {
    color: var(--ink-4);
    cursor: grab;
    display: flex; align-items: center;
  }
  .fc-label {
    display: flex; align-items: center; gap: 10px;
    min-width: 0;
  }
  .fc-name { font-size: 13.5px; color: var(--ink-0); font-weight: 500; }
  .fc-type {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.1em;
    color: var(--ink-3);
    text-transform: uppercase;
    padding: 2px 6px;
    background: var(--bg-3);
    border-radius: 4px;
  }
  .fc-type.formula { color: var(--primary); background: var(--primary-soft); }
  [data-theme="dark"] .fc-type.formula { color: var(--brand-cian); background: rgba(94,234,254,0.1); }
  .fc-type.compare { color: var(--warn); background: var(--warn-soft); }
  .fc-locked { color: var(--ink-3); }
  .fc-expand {
    padding: 12px 0 4px;
    margin-top: 12px;
    border-top: 1px dashed var(--line);
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }
  .fc-expand .full { grid-column: 1 / -1; }

  .add-field-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 12px;
    border: 1.5px dashed var(--line-2);
    border-radius: var(--radius);
    font-size: 13px;
    color: var(--ink-2);
    cursor: pointer;
    transition: all .15s ease;
    background: transparent;
    width: 100%;
    font-weight: 500;
  }
  .add-field-btn:hover { border-color: var(--primary); color: var(--primary); background: var(--primary-soft); }
  [data-theme="dark"] .add-field-btn:hover { border-color: var(--brand-cian); color: var(--brand-cian); background: rgba(94,234,254,0.05); }

  /* Cascade action */
  .cascade-card {
    background: var(--bg-2);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 14px 16px;
    font-size: 13px;
  }
  .cascade-card code {
    font-family: var(--mono);
    font-size: 11.5px;
    background: var(--bg-3);
    padding: 2px 6px;
    border-radius: 4px;
    color: var(--accent);
  }
  .cascade-arrow { color: var(--primary); font-weight: 500; }
  [data-theme="dark"] .cascade-arrow { color: var(--brand-cian); }

  /* Preview panel */
  .preview-tabs {
    display: inline-flex;
    padding: 3px;
    background: var(--bg-3);
    border-radius: 8px;
    border: 1px solid var(--line);
  }
  .preview-tab {
    padding: 5px 11px;
    border-radius: 6px;
    font-size: 11.5px;
    color: var(--ink-2);
    font-family: var(--mono);
    letter-spacing: 0.05em;
    cursor: pointer;
    transition: all .15s ease;
  }
  .preview-tab.active {
    background: var(--bg-1);
    color: var(--ink-0);
    box-shadow: var(--shadow-sm);
  }

  .preview-frame {
    background: var(--bg-1);
    border: 1px solid var(--line-2);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-md);
    margin: 12px auto 0;
    transition: all .3s cubic-bezier(.2,.6,.2,1);
    overflow: hidden;
  }
  .preview-frame.desktop { max-width: 100%; }
  .preview-frame.mobile { max-width: 320px; border-radius: 28px; border: 8px solid #0C1324; padding: 0; overflow: hidden; }
  .preview-frame.mobile::before {
    content: "";
    display: block;
    height: 22px;
    background: #0C1324;
    position: relative;
  }

  /* === RECORD DETAIL === */
  .rec-hero {
    background: var(--bg-1);
    border: 1px solid var(--line);
    border-radius: var(--radius-lg);
    padding: 26px 28px;
    margin-bottom: 20px;
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 24px;
  }
  .rec-hero h2 {
    font-family: var(--serif);
    font-weight: 400;
    font-size: 36px;
    line-height: 1.05;
    margin: 6px 0 0;
    letter-spacing: -0.02em;
    color: var(--ink-0);
  }
  .rec-hero h2 .italic { font-style: italic; color: var(--primary); }
  [data-theme="dark"] .rec-hero h2 .italic { color: var(--brand-cian); }
  .rec-hero-meta {
    display: flex;
    gap: 24px;
    margin-top: 16px;
    flex-wrap: wrap;
  }
  .rec-hero-meta .m {
    display: flex; flex-direction: column; gap: 3px;
  }
  .rec-hero-meta .mk {
    font-family: var(--mono); font-size: 10px;
    letter-spacing: 0.16em; text-transform: uppercase;
    color: var(--ink-3);
  }
  .rec-hero-meta .mv { font-size: 13.5px; color: var(--ink-1); font-weight: 500; }

  .rec-grid {
    display: grid;
    grid-template-columns: 1fr 1.8fr;
    gap: 20px;
    align-items: start;
  }

  /* Tables */
  .table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }
  .table thead th {
    text-align: left;
    font-family: var(--mono);
    font-size: 10.5px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--ink-3);
    padding: 12px 16px;
    border-bottom: 1px solid var(--line);
    background: var(--bg-2);
    font-weight: 500;
  }
  .table tbody td {
    padding: 14px 16px;
    border-bottom: 1px solid var(--line);
    color: var(--ink-1);
    vertical-align: middle;
  }
  .table tbody tr { transition: background .1s ease; cursor: pointer; }
  .table tbody tr:hover { background: var(--bg-3); }
  .table tbody tr:last-child td { border-bottom: 0; }
  .table .col-mono { font-family: var(--mono); font-size: 12.5px; color: var(--ink-0); }

  /* === MOBILE DYNAMIC FORM === */
  .phone-stage {
    display: flex;
    justify-content: center;
    padding: 20px 0 40px;
  }
  .phone {
    width: 380px;
    height: 780px;
    background: #0B1020;
    border-radius: 44px;
    padding: 12px;
    box-shadow:
      0 0 0 2px rgba(255,255,255,0.04),
      0 40px 80px -30px rgba(0,0,0,0.4),
      0 10px 30px -10px rgba(30,58,138,0.25);
    position: relative;
    flex-shrink: 0;
  }
  .phone::before {
    content: "";
    position: absolute;
    top: 26px; left: 50%;
    transform: translateX(-50%);
    width: 110px; height: 30px;
    background: #000;
    border-radius: 20px;
    z-index: 10;
  }
  .phone-screen {
    background: var(--bg-0);
    border-radius: 32px;
    height: 100%;
    overflow: hidden;
    position: relative;
    display: flex;
    flex-direction: column;
  }
  .ph-status {
    height: 48px;
    display: flex; align-items: flex-start; justify-content: space-between;
    padding: 14px 32px 0;
    font-family: var(--sans);
    font-size: 14px;
    font-weight: 600;
    color: var(--ink-0);
    flex-shrink: 0;
  }
  .ph-status .icons { display: flex; align-items: center; gap: 5px; color: var(--ink-0); }

  .ph-header {
    padding: 8px 16px 14px;
    display: flex;
    align-items: center;
    gap: 10px;
    border-bottom: 1px solid var(--line);
    background: var(--bg-1);
    flex-shrink: 0;
  }
  .ph-back {
    width: 36px; height: 36px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    color: var(--ink-1);
    background: var(--bg-3);
  }
  .ph-title { flex: 1; min-width: 0; }
  .ph-title .t {
    font-size: 15px;
    color: var(--ink-0);
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .ph-title .s {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--warn);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-top: 2px;
  }

  .ph-body {
    flex: 1;
    overflow-y: auto;
    padding: 20px 16px 140px;
    background: var(--bg-0);
  }
  .ph-section-label {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--ink-3);
    margin: 8px 0 10px;
  }
  .ph-field { margin-bottom: 18px; }
  .ph-field .input { min-height: 52px; font-size: 16px; }
  .ph-field .unit-input { min-height: 52px; }
  .ph-field .unit-input input { font-size: 16px; }
  .ph-field-label {
    font-size: 13px;
    color: var(--ink-1);
    font-weight: 500;
    margin-bottom: 7px;
    display: flex; justify-content: space-between; align-items: center;
  }
  .ph-calc-box {
    padding: 14px 16px;
    background: var(--bg-3);
    border: 1px dashed var(--line-strong);
    border-radius: 10px;
    font-family: var(--mono);
    font-size: 22px;
    color: var(--ink-1);
    display: flex; align-items: center; justify-content: space-between;
  }
  .ph-calc-box .unit { font-size: 12px; color: var(--ink-3); font-family: var(--mono); }

  .ph-result-fail {
    padding: 14px 16px;
    background: var(--danger-soft);
    border: 1.5px solid var(--danger);
    border-radius: 12px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .ph-result-fail .x {
    width: 28px; height: 28px;
    background: var(--danger);
    color: #fff;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .ph-result-fail .txt { font-size: 13.5px; color: var(--danger); font-weight: 500; line-height: 1.35; }

  .ph-attach-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-top: 8px;
  }
  .ph-attach {
    padding: 14px;
    border: 1.5px dashed var(--line-2);
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    font-size: 13px;
    color: var(--ink-1);
    background: var(--bg-1);
  }

  .ph-bottom {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    padding: 12px 16px 28px;
    background: linear-gradient(to top, var(--bg-1) 60%, transparent);
    display: flex;
    gap: 10px;
    border-top: 1px solid var(--line);
  }
  .ph-bottom .btn {
    flex: 1;
    justify-content: center;
    min-height: 48px;
    font-size: 14px;
  }

  /* === TWEAKS panel === */
  .tweaks-panel {
    position: fixed;
    bottom: 20px;
    right: 20px;
    width: 300px;
    background: var(--bg-1);
    border: 1px solid var(--line-strong);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-lg);
    padding: 18px 20px;
    z-index: 100;
    transform: translateY(20px);
    opacity: 0;
    pointer-events: none;
    transition: all .25s cubic-bezier(.2,.6,.2,1);
  }
  .tweaks-panel.open { transform: translateY(0); opacity: 1; pointer-events: auto; }
  .tweaks-panel h4 {
    font-family: var(--serif);
    font-size: 22px;
    font-weight: 400;
    margin: 0 0 14px;
    color: var(--ink-0);
    letter-spacing: -0.01em;
  }
  .tweaks-panel h4 em { font-style: italic; color: var(--primary); }
  [data-theme="dark"] .tweaks-panel h4 em { color: var(--brand-cian); }
  .tw-row { margin-bottom: 14px; }
  .tw-row-head {
    display: flex; justify-content: space-between; align-items: center;
    font-size: 12px; color: var(--ink-1); margin-bottom: 8px;
    font-weight: 500;
  }
  .tw-row-head span.val { font-family: var(--mono); font-size: 11px; color: var(--ink-3); letter-spacing: 0.05em; }
  .tw-segment {
    display: flex;
    padding: 3px;
    background: var(--bg-3);
    border: 1px solid var(--line);
    border-radius: 8px;
  }
  .tw-segment button {
    flex: 1;
    padding: 6px 10px;
    font-size: 12px;
    color: var(--ink-2);
    border-radius: 6px;
    transition: all .15s ease;
  }
  .tw-segment button.on {
    background: var(--bg-1);
    color: var(--ink-0);
    box-shadow: var(--shadow-sm);
    font-weight: 500;
  }

  /* Sticky bottom bar for Builder */
  .builder-foot {
    height: 76px;
    border-top: 1px solid var(--line);
    background: var(--bg-1);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 32px;
    flex-shrink: 0;
  }
  .builder-foot .st { display: flex; align-items: center; gap: 16px; font-size: 13px; color: var(--ink-2); }
  .builder-foot .actions { display: flex; gap: 10px; }

  /* Empty state brain easter egg */
  .empty-brain {
    display: flex; flex-direction: column; align-items: center;
    padding: 48px 0;
    color: var(--ink-3);
    gap: 16px;
  }
  .empty-brain svg { width: 100px; height: 100px; opacity: 0.7; }
  .empty-brain .label { font-family: var(--mono); font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase; }

  /* Scroll prettier */
  .content::-webkit-scrollbar, .builder-col::-webkit-scrollbar, .ph-body::-webkit-scrollbar { width: 8px; }
  .content::-webkit-scrollbar-thumb, .builder-col::-webkit-scrollbar-thumb, .ph-body::-webkit-scrollbar-thumb { background: var(--line-2); border-radius: 4px; }
  .content::-webkit-scrollbar-thumb:hover, .builder-col::-webkit-scrollbar-thumb:hover, .ph-body::-webkit-scrollbar-thumb:hover { background: var(--line-strong); }

  /* Loading/transition */
  @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }

      <div key={f.id} className={"field-card" + (selected ? " selected" : "")} onClick={() => setSelectedField(f.id)}>

        <div className="tw-row-head"><span>Tema</span><span className="val">{theme.toUpperCase()}</span></div>

      </div>

// === src/App.jsx ===
function App() {
  const [screen, setScreen] = React.useState(() => localStorage.getItem("synapse.screen") || "dashboard");
  const [tweaksOpen, setTweaksOpen] = React.useState(false);
  const [theme, setThemeState] = React.useState(window.__TWEAKS.theme || "light");
  const [density, setDensityState] = React.useState(window.__TWEAKS.density || "normal");

  React.useEffect(() => {
    document.documentElement.setAttribute("data-theme", theme);
    document.documentElement.setAttribute("data-density", density);
    document.body.style.background = "var(--bg-0)";
  }, [theme, density]);

  React.useEffect(() => {
    localStorage.setItem("synapse.screen", screen);
  }, [screen]);

  // Edit mode protocol
  React.useEffect(() => {
    const handler = (e) => {
      if (!e.data || typeof e.data !== "object") return;
      if (e.data.type === "__activate_edit_mode") setTweaksOpen(true);
      if (e.data.type === "__deactivate_edit_mode") setTweaksOpen(false);
    };
    window.addEventListener("message", handler);
    window.parent.postMessage({ type: "__edit_mode_available" }, "*");
    return () => window.removeEventListener("message", handler);
  }, []);

  const persist = (edits) => {
    window.parent.postMessage({ type: "__edit_mode_set_keys", edits }, "*");
  };
  const setTheme = (t) => { setThemeState(t); persist({ theme: t }); };
  const setDensity = (d) => { setDensityState(d); persist({ density: d }); };

  const labels = {
    dashboard: "Dashboard",
    records: "Registros",
    docs: "Documentos",
    recipes: "Recetas",
    matrices: "Matrices",
    methods: "Métodos",
    templates: "Plantillas calib.",
    batches: "Lotes",
    samples: "Muestras",
    instruments: "Instrumental",
    calibrations: "Calibraciones",
    stock: "Stock",
    nc: "No conformidades",
    approvals: "Aprobaciones",
    audit: "Auditoría",
    settings: "Ajustes",
    builder: "Registros",
    detail: "Registros",
    mobile: "Registros",
  };

  const crumbs = React.useMemo(() => {
    if (screen === "dashboard") return ["Synapse"];
    if (screen === "builder") return ["Synapse","Registros","Nuevo registro"];
    if (screen === "detail") return ["Synapse","Registros","Verif. balanza BAL‑003"];
    if (screen === "mobile") return ["Synapse","Registros","Verif. balanza BAL‑003","Vista móvil"];
    return ["Synapse", labels[screen] || screen];
  }, [screen]);

  const nav = (id) => setScreen(id);

  let content;
  if (screen === "dashboard") {
    content = <Dashboard
      onOpenRecord={() => setScreen("detail")}
      onOpenBuilder={() => setScreen("builder")}
      onOpenMobile={() => setScreen("mobile")}
    />;
  } else if (screen === "builder") {
    content = <RecordBuilder onBack={() => setScreen("dashboard")} onOpenDetail={() => setScreen("detail")}/>;
  } else if (screen === "detail") {
    content = <RecordDetail onBack={() => setScreen("dashboard")} onOpenMobile={() => setScreen("mobile")}/>;
  } else if (screen === "mobile") {
    content = <MobileForm onBack={() => setScreen("detail")}/>;
  } else {
    // Generic placeholder for side-nav items
    content = (
      <div className="fade-in">
        <div className="ph">
          <div>
            <div style={{fontFamily:"var(--mono)",fontSize:10,letterSpacing:"0.2em",textTransform:"uppercase",color:"var(--ink-3)",marginBottom:10}}>
              · {labels[screen]}
            </div>
            <h1>Sección <span className="italic">{(labels[screen]||"").toLowerCase()}.</span></h1>
            <p className="sub">
              Este prototipo enfoca las 5 pantallas clave del flujo de registros.
              El resto del producto comparte el mismo sistema visual: tablas con entries, builder lateral, cascadas declarativas y vista móvil.
            </p>
          </div>
          <button className="btn btn-ghost" onClick={() => setScreen("dashboard")}>← Volver al dashboard</button>
        </div>
        <div className="card">
          <div className="empty-brain">
            <BrainMark size={100} animated={true}/>
            <div className="label">· Pantalla no incluida en este prototipo</div>
            <div style={{fontSize:13,color:"var(--ink-2)",maxWidth:420,textAlign:"center"}}>
              Los ítems de <b style={{color:"var(--ink-0)"}}>Registros</b>, <b style={{color:"var(--ink-0)"}}>Builder</b>, <b style={{color:"var(--ink-0)"}}>Detalle</b> y <b style={{color:"var(--ink-0)"}}>Vista móvil</b> están activos desde el dashboard.
            </div>
          </div>
        </div>
      </div>
    );
  }

  const edgeToEdge = screen === "builder";
  const screenLabel = "Synapse · " + (labels[screen] || screen);

  return (
    <div className="shell" data-screen-label={screenLabel}>
      <Sidebar screen={screen} onNavigate={nav}/>
      <div className="main-col">
        <Topbar crumbs={crumbs} onBack={() => setScreen("dashboard")} onTweaksToggle={() => setTweaksOpen(o => !o)}/>
        <main className={"content" + (edgeToEdge ? " edge-to-edge" : "")}>
          {content}
        </main>
      </div>
      <Tweaks open={tweaksOpen} onClose={() => setTweaksOpen(false)}
              theme={theme} setTheme={setTheme}
              density={density} setDensity={setDensity}/>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);


</script>

</body>
